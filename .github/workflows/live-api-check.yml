name: live-smoke

# Opt-in live API smoke against a real Lemon Squeezy account.
# Nightly runs require vars.LIVE_SMOKE_ENABLED=true; workflow_dispatch always runs.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Live API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip nightly runs when no API key secret is configured (forks, fresh clones).
    # Manual workflow_dispatch still runs so maintainers can opt in explicitly.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LIVE_SMOKE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Run live smoke tests
        env:
          LEMON_SQUEEZY_TEST_API_KEY: ${{ secrets.LEMON_SQUEEZY_TEST_API_KEY }}
          LEMON_SQUEEZY_LIVE_API_KEY: ${{ secrets.LEMON_SQUEEZY_LIVE_API_KEY }}
        run: pnpm test:live
