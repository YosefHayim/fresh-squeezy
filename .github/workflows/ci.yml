name: ci

# Merge gate for main. Mirrors `pnpm verify` (biome + typecheck + test + build)
# and also checks docs-derived API types + coverage on Node 20.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint & format (biome ci)
        if: matrix.node == '20'
        run: pnpm exec biome ci .

      - name: docs-derived API types
        if: matrix.node == '20'
        run: pnpm check:api-types

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test -- --coverage

      - name: build
        run: pnpm build

      - name: upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
