name: changelog-drift

# Weekly (and on-demand) drift check against the Lemon Squeezy docs:
# 1) regenerate docs-derived API types and open a PR if they changed
# 2) hash the API changelog against src/features/upkeep/changelog-snapshot.json and
#    open/comment a changelog-drift issue when new entries appear
#
# Scripts are pure Node (no package deps). pnpm is used only to invoke the
# package.json script names so maintainers and CI share one command surface.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    name: Detect Lemon Squeezy changelog drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Refresh docs-derived API types
        run: pnpm generate:api-types

      - name: Open API type refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- src/shared/lemon-squeezy-api-types.ts; then
            echo "Generated API types are current."
            exit 0
          fi

          branch="automation/lemon-squeezy-api-types"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/lemon-squeezy-api-types.ts
          git commit -m "chore: refresh Lemon Squeezy API types"
          git push origin "HEAD:$branch" --force

          body=$(cat <<EOF_BODY
          Refreshes \`src/shared/lemon-squeezy-api-types.ts\` from the Lemon Squeezy object docs.

          - Source index: https://docs.lemonsqueezy.com/api/getting-started/requests
          - Workflow run: $RUN_URL

          Validator policy still needs human review when the changelog introduces new webhook events or behavior changes.
          EOF_BODY
          )

          existing=$(gh pr list --repo "$REPO" --state open --head "$branch" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" \
              --head "$branch" \
              --title "Refresh Lemon Squeezy generated API types" \
              --body "$body"
          fi

      - name: Run drift check
        id: drift
        run: pnpm check:changelog -- --github-output "$GITHUB_OUTPUT"

      - name: Open drift issue
        if: failure() && steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_HASH: ${{ steps.drift.outputs.previous_hash }}
          CURRENT_HASH: ${{ steps.drift.outputs.current_hash }}
          PREVIOUS_SEEN: ${{ steps.drift.outputs.previous_seen }}
          CURRENT_SEEN: ${{ steps.drift.outputs.current_seen }}
          DIFF_B64: ${{ steps.drift.outputs.diff_b64 }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create changelog-drift --repo "$REPO" --force \
            --description "Lemon Squeezy API changelog changed since the last snapshot"

          # Decode the structured diff if present
          if [ -n "$DIFF_B64" ]; then
            DIFF=$(printf '%s' "$DIFF_B64" | base64 -d)
            DIFF_SECTION="## New entries since last snapshot

          $DIFF"
          else
            DIFF_SECTION="## New entries since last snapshot

          No structured diff available — review the changelog page manually or re-run after updating the snapshot once."
          fi

          existing=$(gh issue list --repo "$REPO" --state open --label changelog-drift --json number --jq '.[0].number' || true)
          body=$(cat <<EOF_BODY
          The Lemon Squeezy API changelog has changed since the last committed snapshot.

          - URL: https://docs.lemonsqueezy.com/api/getting-started/changelog
          - Previous hash: \`$PREVIOUS_HASH\` (seen $PREVIOUS_SEEN)
          - Current hash:  \`$CURRENT_HASH\` (seen $CURRENT_SEEN)
          - Workflow run:  $RUN_URL

          $DIFF_SECTION

          ## What to do

          1. Open the changelog URL above and review the new entries.
          2. Run \`pnpm generate:api-types\` if the scheduled type refresh PR did not already cover object-field changes.
          3. Update \`src/shared/support-manifest.ts\` for policy-level changes:
             - Add new webhook events to \`RECOMMENDED_WEBHOOK_EVENTS\` or \`OPTIONAL_WEBHOOK_EVENTS\`.
          4. Refresh the snapshot:
             \`\`\`
             pnpm check:changelog -- --update
             \`\`\`
          5. Commit the manifest change, generated types if changed, and \`src/features/upkeep/changelog-snapshot.json\`.
          EOF_BODY
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" \
              --title "Lemon Squeezy changelog drift detected ($CURRENT_SEEN)" \
              --label changelog-drift \
              --body "$body"
          fi
