name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"
  # release.yml starts this run, since a tag it creates with GITHUB_TOKEN fires no push event.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm >= 11.5.1 required for OIDC trusted publishing.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Node/npm
        run: |
          node -v
          npm -v
          test "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -1)" = "11.5.1" || {
            echo "::error::npm $(npm -v) is below 11.5.1; publishing is not supported"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --provenance
