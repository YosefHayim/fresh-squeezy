name: Publish Package
'on':
  push:
    tags:
      - v*.*.*
  workflow_run:
    workflows:
      - Release
    types:
      - completed
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: |
      github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Verify Node/npm
        run: |
          node -v
          npm -v
          test "$(printf '%s\n' "11.5.1" "$(npm -v)" | sort -V | head -1)" = "11.5.1" || {
            echo "::error::npm $(npm -v) is below 11.5.1; publishing is not supported"
            exit 1
          }
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --provenance
    timeout-minutes: 15
