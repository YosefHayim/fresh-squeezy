name: Release
'on':
  pull_request:
    types:
    - closed
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Configure Git
      run: 'git config user.name "github-actions[bot]"

        git config user.email "github-actions[bot]@users.noreply.github.com"

        '
    - name: Check if release needed
      id: skip_check
      run: "if git describe --exact-match HEAD >/dev/null 2>&1; then\n  echo \"HEAD is already tagged - skipping\
        \ release\"\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - name: Get release description
      if: steps.skip_check.outputs.skip != 'true'
      id: desc
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: "if [ \"${{ github.event_name }}\" = \"push\" ]; then\n  echo \"title=$(git log -1 --pretty=format:'%s')\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"title=$PR_TITLE\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Determine version bump
      if: steps.skip_check.outputs.skip != 'true'
      id: bump
      env:
        LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
      run: "if [ \"${{ github.event_name }}\" = \"push\" ]; then\n  echo \"type=patch\" >> \"$GITHUB_OUTPUT\"\n\
        elif echo \"$LABELS\" | grep -q '\"major\"'; then\n  echo \"type=major\" >> \"$GITHUB_OUTPUT\"\nelif echo\
        \ \"$LABELS\" | grep -q '\"minor\"'; then\n  echo \"type=minor\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"\
        type=patch\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Bump version in package.json
      if: steps.skip_check.outputs.skip != 'true'
      id: version
      run: "if ! node -e \"const p = require('./package.json'); if (!p.version) process.exit(1);\" 2>/dev/null;\
        \ then\n  echo \"No version found in package.json - initializing to 0.1.0\"\n  npm pkg set version=0.1.0\n\
        fi\nNEW_VERSION=$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)\necho \"version=$NEW_VERSION\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"Bumped to $NEW_VERSION (${{ steps.bump.outputs.type }})\"\n"
    - name: Build release notes from commits
      if: steps.skip_check.outputs.skip != 'true'
      id: notes
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        BUMP_TYPE: ${{ steps.bump.outputs.type }}
      run: "PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo \"\")\nif [ -n \"$PREV_TAG\" ]; then\n\
        \  COMMITS=$(git log \"$PREV_TAG\"..HEAD --pretty=format:\"- %s (%h)\" --no-merges)\nelse\n  COMMITS=$(git\
        \ log --pretty=format:\"- %s (%h)\" --no-merges -20)\nfi\n{\n  echo \"body<<RELEASE_EOF\"\n  echo \"## What\
        \ Changed\"\n  echo \"\"\n  if [ \"${{ github.event_name }}\" = \"push\" ]; then\n    echo \"**Direct push\
        \ to ${GITHUB_REF_NAME}**\"\n  else\n    echo \"**PR:** [#${PR_NUMBER} - ${PR_TITLE}](${PR_URL})\"\n  fi\n\
        \  echo \"**Bump:** \\`${BUMP_TYPE}\\`\"\n  echo \"\"\n  echo \"### Commits\"\n  echo \"\"\n  echo \"$COMMITS\"\
        \n  echo \"\"\n  echo \"RELEASE_EOF\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Commit version bump and create tag
      if: steps.skip_check.outputs.skip != 'true'
      run: "git add package.json\nif [ -f pnpm-lock.yaml ]; then git add pnpm-lock.yaml; fi\ngit commit -m \"chore(release):\
        \ ${{ steps.version.outputs.version }}\"\ngit tag -a \"${{ steps.version.outputs.version }}\" \\\n  -m \"\
        Release ${{ steps.version.outputs.version }} - ${{ steps.desc.outputs.title }}\"\ngit push origin main --follow-tags\n"
    - name: Create GitHub Release
      if: steps.skip_check.outputs.skip != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.version }}
      run: "gh release create \"$TAG\" \\\n  --title \"$TAG - ${{ steps.desc.outputs.title }}\" \\\n  --notes \"\
        ${{ steps.notes.outputs.body }}\" \\\n  --latest\n"
    timeout-minutes: 15
